<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Reading your swap costs</title>
<desc id="desc">Service fees and quoted network costs are deducted to estimate what you receive. Wallet funding and later transfers or recovery are separate costs.</desc>
<rect width="1600" height="900" rx="28" fill="#080a09"/>
<g font-family="Arial, Helvetica, sans-serif">
<circle cx="68" cy="64" r="9" fill="#c2e821"/>
<text x="94" y="76" fill="#c2e821" font-size="30" letter-spacing="3">BITCOIN → USDC</text>
<text x="58" y="158" fill="#fff" font-size="64" font-weight="700">Reading your swap costs</text>
<rect x="56" y="210" width="770" height="574" rx="26" fill="#131715" stroke="#c2e821" stroke-width="3"/>
<text x="96" y="280" fill="#c2e821" font-size="38" font-weight="700">IN YOUR QUOTE</text>
<line x1="96" y1="310" x2="786" y2="310" stroke="#394038" stroke-width="2"/>
<text x="96" y="380" fill="#fff" font-size="46">Value at the quoted rate</text>
<text x="96" y="456" fill="#c2e821" font-size="50">−</text><text x="156" y="454" fill="#fff" font-size="46">Service fee</text>
<text x="96" y="530" fill="#c2e821" font-size="50">−</text><text x="156" y="528" fill="#fff" font-size="46">Quoted network costs</text>
<line x1="96" y1="565" x2="786" y2="565" stroke="#394038" stroke-width="2"/>
<text x="96" y="633" fill="#c2e821" font-size="50">=</text>
<text x="156" y="628" fill="#fff" font-size="46" font-weight="700">Estimated amount</text>
<text x="156" y="683" fill="#fff" font-size="46" font-weight="700">to receive</text>
<text x="96" y="746" fill="#b8c0b9" font-size="32">Quoted fees are already deducted.</text>
<rect x="862" y="210" width="682" height="574" rx="26" fill="#131715" stroke="#454d45" stroke-width="2"/>
<text x="902" y="280" fill="#fff" font-size="38" font-weight="700">PAID SEPARATELY</text>
<line x1="902" y1="310" x2="1504" y2="310" stroke="#394038" stroke-width="2"/>
<circle cx="911" cy="366" r="7" fill="#c2e821"/>
<text x="942" y="380" fill="#fff" font-size="46">Wallet funding fee</text>
<circle cx="911" cy="478" r="7" fill="#c2e821"/>
<text x="942" y="492" fill="#fff" font-size="46">Later transfers</text>
<text x="942" y="547" fill="#fff" font-size="46">or recovery</text>
<text x="902" y="683" fill="#b8c0b9" font-size="34">When needed, depending</text>
<text x="902" y="729" fill="#b8c0b9" font-size="34">on the route.</text>
<text x="58" y="852" fill="#b8c0b9" font-size="34">Check the quote and your wallet before signing.</text>
</g></svg>
